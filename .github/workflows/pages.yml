name: Verify and deploy Cloudline Godot
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Test integrity-checked assembly
        run: python3 godot-cloudline/web-build/test_assembly.py
      - name: Test mobile shell and export contract
        run: |
          node godot-cloudline/web-build/test_mobile_state.cjs
          python3 godot-cloudline/web-build/test_mobile_export.py
      - name: Assemble official Godot engine
        run: python3 godot-cloudline/web-build/assemble_wasm.py
      - name: Verify frozen source and Web artifacts
        run: python3 godot-cloudline/web-build/verify_release.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: cloudline-godot
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
