<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>$GODOT_PROJECT_NAME</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cloudline">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="cloudline-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="cloudline-180.png">
<link rel="manifest" href="manifest.webmanifest">
$GODOT_HEAD_INCLUDE
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #102c3d; color: #edf7fc; font: 14px system-ui, sans-serif; }
#app { width: 100%; height: 100%; height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); display: flex; flex-direction: column; }
#bar { min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 8px; background: #102c3d; }
/* Fullscreen/installed play has no page toolbar or blue frame. Keep only the
   device's safe-area inset so edge controls do not sit under a notch/gesture bar. */
html.immersive, html.immersive body, html.immersive #app { background: #000; }
html.immersive #bar { display: none; }
#mode { font-size: 12px; }
button { min-height: 44px; min-width: 44px; border: 1px solid #6593a9; border-radius: 6px; color: #fff; background: #183f54; padding: 6px 12px; font: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible { outline: 3px solid #ffe09a; outline-offset: -3px; }
#screen { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #000; }
#canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
#loading { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; padding: 24px; gap: 16px; background: #102c3d; text-align: center; }
#loading[hidden], #help[hidden] { display: none; }
progress { width: min(320px, 90%); }
#help { position: absolute; z-index: 5; inset: 8px; max-width: 520px; max-height: calc(100% - 16px); height: fit-content; margin: auto; padding: 18px; border: 1px solid #6593a9; border-radius: 12px; background: #102c3d; box-shadow: 0 10px 60px #000b; overflow-y: auto; touch-action: pan-y; line-height: 1.6; }
#help h2 { margin: 0 0 8px; font-size: 20px; }
#help p { margin: 8px 0; }
#help-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
</style>
</head>
<body>
<div id="app">
  <header id="bar"><span id="mode" role="status" aria-live="polite">Cloudline · 横屏游玩</span><div><button id="help-button" type="button" aria-label="全屏与安装帮助" aria-controls="help">?</button> <button id="display-button" type="button" aria-controls="help">全屏 / 安装</button></div></header>
  <main id="screen">
    <canvas id="canvas" tabindex="0" aria-label="Cloudline 飞行游戏">浏览器不支持 Canvas</canvas>
    <div id="loading"><strong>Cloudline</strong><span id="load-message" role="status">正在加载飞行游戏…</span><progress id="progress" aria-label="游戏加载进度"></progress></div>
    <section id="help" role="dialog" aria-modal="false" aria-labelledby="help-title" hidden>
      <h2 id="help-title">全屏与主屏幕</h2>
      <p id="feedback" role="status" aria-live="polite"></p>
      <p>iPhone：在 Safari 打开本页，点“分享”→“添加到主屏幕”；若看到“作为网页 App 打开”，请开启。之后从主屏幕的 Cloudline 图标进入，即可隐藏浏览器地址栏。</p>
      <p>Android：点“进入全屏”；也可在浏览器菜单选择“安装应用”或“添加到主屏幕”（名称因浏览器而异）。</p>
      <p>建议横屏游玩。普通标签页的全屏取决于浏览器支持；系统状态栏或手势条可能仍会显示。主屏幕版本仍需要联网。</p>
      <div id="help-actions"><button id="fullscreen-button" type="button">进入全屏</button><button id="close-help" type="button">返回游戏</button></div>
    </section>
  </main>
</div>
<noscript>请启用 JavaScript 后重新打开。</noscript>
<script>
// Kept in the export shell so re-exporting cannot discard mobile behavior.
(function () {
  'use strict';
  const root = document.documentElement;
  const canvas = document.getElementById('canvas');
  const screen = document.getElementById('screen');
  const help = document.getElementById('help');
  const feedback = document.getElementById('feedback');
  const button = document.getElementById('display-button');
  const fullButton = document.getElementById('fullscreen-button');
  const mode = document.getElementById('mode');
  const standaloneQuery = window.matchMedia('(display-mode: standalone)');
  const installedFullscreenQuery = window.matchMedia('(display-mode: fullscreen)');
  let busy = false;
  let wasImmersive = false;
  const active = () => document.fullscreenElement || document.webkitFullscreenElement;
  const standalone = () => navigator.standalone === true || standaloneQuery.matches || installedFullscreenQuery.matches;
  const supported = () => !!((root.requestFullscreen && document.fullscreenEnabled !== false) || (root.webkitRequestFullscreen && document.webkitFullscreenEnabled !== false));
  function showHelp(message) {
    feedback.textContent = message || '';
    help.hidden = false;
    document.getElementById('close-help').focus();
  }
  function refresh() {
    const immersive = !!active() || standalone();
    root.classList.toggle('immersive', immersive);
    if (immersive && !wasImmersive) { help.hidden = true; canvas.focus(); }
    wasImmersive = immersive;
    fullButton.hidden = !supported() || !!active() || standalone();
    button.textContent = active() ? '退出全屏' : (standalone() ? '显示帮助' : (supported() ? '进入全屏' : '添加到主屏幕'));
    mode.textContent = active() ? 'Cloudline · 全屏' : (standalone() ? 'Cloudline · 主屏幕模式' : 'Cloudline · 横屏游玩');
    resize();
  }
  function failure() {
    busy = false;
    refresh();
    showHelp('浏览器未允许全屏。可点下方按钮重试，或按说明添加到主屏幕；也可以返回游戏继续游玩。');
  }
  function toggle() {
    if (busy) return;
    if (!active() && (!supported() || standalone())) {
      showHelp(standalone() ? '已从主屏幕打开，浏览器地址栏已隐藏。系统界面由设备控制。' : '当前浏览器不支持此页面直接全屏，请使用主屏幕方式。');
      return;
    }
    busy = true;
    try {
      // Call synchronously inside the click: never wait for the engine or download.
      const result = active()
        ? (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen())
        : (root.requestFullscreen ? root.requestFullscreen() : root.webkitRequestFullscreen());
      Promise.resolve(result).then(() => { busy = false; help.hidden = true; refresh(); }, failure);
    } catch (_) { failure(); }
  }
  window.cloudlineDisplay = { toggle };
  button.addEventListener('click', toggle);
  document.getElementById('help-button').addEventListener('click', () => showHelp(''));
  fullButton.addEventListener('click', toggle);
  document.getElementById('close-help').addEventListener('click', () => { help.hidden = true; canvas.focus(); });
  document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && !help.hidden) { help.hidden = true; canvas.focus(); } });
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(name => document.addEventListener(name, () => { busy = false; refresh(); resize(); }));
  ['fullscreenerror', 'webkitfullscreenerror'].forEach(name => document.addEventListener(name, failure));
  [standaloneQuery, installedFullscreenQuery].forEach(query => { if (query.addEventListener) query.addEventListener('change', refresh); });
  window.addEventListener('pageshow', refresh);
  // Policy 0 gives the engine the actual safe-area viewport, excluding the
  // toolbar only in ordinary tabs. Godot observes backing-size changes each frame.
  function resize() {
    const rect = screen.getBoundingClientRect();
    const ratio = window.devicePixelRatio || 1;
    const width = Math.max(1, Math.round(rect.width * ratio));
    const height = Math.max(1, Math.round(rect.height * ratio));
    if (canvas.width !== width) canvas.width = width;
    if (canvas.height !== height) canvas.height = height;
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(screen);
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  refresh(); resize();
}());
</script>
<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
// Single-threaded build: no service worker and no isolation-header dependency.
GODOT_CONFIG.canvasResizePolicy = 0;
GODOT_CONFIG.ensureCrossOriginIsolationHeaders = false;
(function () {
  const loading = document.getElementById('loading');
  const message = document.getElementById('load-message');
  const progress = document.getElementById('progress');
  function fail(error) { message.textContent = '加载失败：' + (error.message || String(error)) + '。请检查网络，并使用支持 WebGL 2 的浏览器重新打开。'; progress.hidden = true; }
  try {
    const missing = Engine.getMissingFeatures({ threads: false });
    if (missing.length) { fail(new Error(missing.join(', '))); return; }
    new Engine(GODOT_CONFIG).startGame({ onProgress(current, total) {
      if (total > 0) { progress.value = current; progress.max = total; }
      else { progress.removeAttribute('value'); }
    }}).then(() => { loading.hidden = true; }, fail);
  } catch (error) { fail(error); }
}());
</script>
</body>
</html>
